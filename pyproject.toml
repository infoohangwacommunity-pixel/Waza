[project]
name = "wax-prep"
version = "0.2.0"
description = "WAX Prep — the tutor that actually knows you"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "tenacity>=8.2",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
wax-api = "wax.api.main:run"
wax-worker = "wax.workers.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wax*"]
