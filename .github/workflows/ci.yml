name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Syntax
        run: |
          python -c "import ast, pathlib
for p in pathlib.Path('wax').rglob('*.py'):
  ast.parse(p.read_text())
print('syntax ok')"
      - name: Unit tests
        run: pytest -q tests/ --ignore=tests/integration
      - name: Forbidden patterns
        run: |
          if rg -n "CostProtector|cost_exceeded|can_spend|estimate_llm_cost|budget_cents|JAMBMode|QuizMode|StudentMode" wax --type py; then
            echo "Forbidden pattern found" && exit 1
          fi
          echo "forbidden patterns clean"
