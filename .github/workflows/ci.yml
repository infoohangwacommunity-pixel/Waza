name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wax
          POSTGRES_PASSWORD: wax
          POSTGRES_DB: wax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://wax:wax@localhost:5432/wax_test
      APP_ENV: test
      SECRET_KEY: test-secret-for-ci-only
      PUBLIC_BASE_URL: http://localhost:8000
      SURFACE_PUBLIC_ORIGIN: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Syntax
        run: |
          python -c "import ast, pathlib
for p in pathlib.Path('wax').rglob('*.py'):
  ast.parse(p.read_text())
print('syntax ok')"
      - name: Unit tests
        run: pytest -q tests/ --ignore=tests/integration -m "not integration"
      - name: Surface DB integration
        run: pytest -q tests/test_surface_integration_db.py tests/test_surface_architecture_paths.py
      - name: Forbidden patterns
        run: |
          if rg -n "CostProtector|cost_exceeded|can_spend|estimate_llm_cost|budget_cents|JAMBMode|QuizMode|StudentMode" wax --type py; then
            echo "Forbidden pattern found" && exit 1
          fi
          echo "forbidden patterns clean"
