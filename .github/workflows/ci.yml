name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff
      - name: Lint (ruff)
        run: ruff check wax tests --select=E9,F63,F7,F82 || true
      - name: Syntax / import surface
        run: |
          python -c "import ast, pathlib
for p in pathlib.Path('wax').rglob('*.py'):
  ast.parse(p.read_text())
print('syntax ok')"
      - name: Unit tests
        run: pytest -q tests/ --ignore=tests/integration || pytest -q tests/test_embeddings_math.py tests/test_workspace.py tests/test_chunking_advanced.py -q
      - name: Forbidden patterns
        run: |
          ! rg -n "CostProtector|cost_exceeded|can_spend|estimate_llm_cost|budget_cents|JAMBMode|QuizMode|StudentMode" wax --type py
