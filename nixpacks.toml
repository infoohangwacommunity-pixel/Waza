# Optional (only if Railway builder is set back to NIXPACKS).
# Prefer Dockerfile (railway.toml builder = DOCKERFILE) for a coherent Python path.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.setup]
nixPkgs = [
  "ffmpeg",
  "tesseract",
  "sox",
  "mediainfo",
  "bubblewrap",
  "poppler_utils",
  "imagemagick",
  "file",
  "unzip",
]
