# OS-level tools for the terminal sandbox allowlist.
# Do NOT override [phases.install] — that breaks Nixpacks Python provider
# (build fails with: python: command not found).
# Python deps are installed automatically from requirements.txt.

[phases.setup]
nixPkgs = [
  "ffmpeg",
  "tesseract",
  "sox",
  "mediainfo",
  "bubblewrap",
  "poppler_utils",
  "imagemagick",
  "file",
]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
