# Railway / Nixpacks: install OS-level tools the terminal sandbox allowlists.
# Python deps still come from requirements.txt.
# Without these, ffmpeg/tesseract/sox/mediainfo/bwrap are missing at runtime.

[phases.setup]
nixPkgs = [
  "ffmpeg",
  "tesseract",
  "sox",
  "libmediainfo",
  "mediainfo",
  "bubblewrap",
  "poppler_utils",
  "imagemagick",
  "file",
]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt",
]

[start]
cmd = "bash scripts/startup.sh uvicorn wax.api.main:app --host 0.0.0.0 --port $PORT"
