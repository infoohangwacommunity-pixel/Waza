[build]
builder = "NIXPACKS"

[deploy]
# Primary guarantee: migrations run in the process start command (see Procfile /
# startCommand). preDeploy is secondary — Railway has not reliably executed it.
startCommand = "bash scripts/startup.sh uvicorn wax.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
