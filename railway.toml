[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run inside scripts/startup.sh (not preDeploy — Railway is unreliable for that).
startCommand = "bash scripts/startup.sh uvicorn wax.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
