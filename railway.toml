[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# PORT is read inside scripts/start_web.sh — do not put $PORT on this line
# (Railway can pass it as a literal string to uvicorn).
startCommand = "bash scripts/start_web.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
