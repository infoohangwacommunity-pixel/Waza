[build]
builder = "NIXPACKS"

[deploy]
# Runs in the service deploy environment (has private network access to Postgres)
# rather than during image build.
preDeployCommand = "sh -c 'echo \"=== Alembic before ===\" && alembic current && alembic history -r -3:head && echo \"=== Running upgrade head ===\" && alembic upgrade head && echo \"=== Alembic after ===\" && alembic current'"
startCommand = "uvicorn wax.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
